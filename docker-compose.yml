services:
  patient-service-db:
    image: mysql:8.4
    container_name: patient-service-db
    environment:
      MYSQL_DATABASE: patient-db
      MYSQL_USER: anurag
      MYSQL_PASSWORD: anurag12345
      MYSQL_ROOT_PASSWORD: ANURAG1231312
    ports:
      - "33306:3306"
    volumes:
      - patient_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pANURAG1231312"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  auth-service-db:
    image: postgres:latest
    container_name: auth-service-db
    environment:
      POSTGRES_DB: auth-db
      POSTGRES_USER: anurag
      POSTGRES_PASSWORD: anurag12345
    ports:
      - "5001:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anurag -d auth-db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_NODE_ID: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - internal

  billing-service:
    build:
      context: ./billing-service
    container_name: billing-service
    ports:
      - "4001:4001"
      - "9001:9001"
    networks:
      - internal

  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    depends_on:
      patient-service-db:
        condition: service_healthy
      billing-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://patient-service-db:3306/patient-db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ANURAG1231312
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_SQL_INIT_MODE: always
    ports:
      - "4000:4000"
    networks:
      - internal

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      auth-service-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth-db
      SPRING_DATASOURCE_USERNAME: anurag
      SPRING_DATASOURCE_PASSWORD: anurag12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: y1RkQJ0kzM0wYc8yN5xP0m+3bQkZk8r2yZ9TzQF8xKs=
    ports:
      - "4005:4005"
    networks:
      - internal

  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    depends_on:
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 4002
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
    ports:
      - "4002:4002"
    networks:
      - internal

  api-gateway-2:
    build:
      context: ./api-gateway-2
    container_name: api-gateway-2
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
    ports:
      - "4004:4004"
    networks:
      - internal

networks:
  internal:

volumes:
  patient_mysql_data:
  auth_postgres_data:
