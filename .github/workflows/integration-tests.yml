name: Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and start services with Docker Compose
        run: docker compose up --build -d

      - name: Wait for api-gateway-2
        run: |
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4004/auth/login || true)"
            if [ "$status" = "401" ] || [ "$status" = "405" ] || [ "$status" = "400" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run integration tests
        run: mvn -B -f integration-tests/pom.xml test

      - name: Capture compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            docker-compose.log

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
