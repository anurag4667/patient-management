name: Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: authdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d authdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: patientdb
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: apache/kafka:latest
        ports:
          - "9092:9092"
          - "9094:9094"
        environment:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        healthcheck:
          test: [ "CMD-SHELL", "bash -c 'printf > /dev/tcp/127.0.0.1/9092'" ]
          interval: 10s
          timeout: 5s
          retries: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Map Docker-style service hostnames
        run: |
          echo "127.0.0.1 auth-service patient-service billing-service" | sudo tee -a /etc/hosts

      - name: Build application modules
        run: |
          ./auth-service/mvnw -B -f auth-service/pom.xml -DskipTests package
          ./billing-service/mvnw -B -f billing-service/pom.xml -DskipTests package
          ./patient-service/mvnw -B -f patient-service/pom.xml -DskipTests package
          ./api-gateway-2/mvnw -B -f api-gateway-2/pom.xml -DskipTests package

      - name: Start auth-service
        run: |
          nohup java -jar auth-service/target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/authdb \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --spring.jpa.hibernate.ddl-auto=none \
            --spring.sql.init.mode=always \
            > auth-service.log 2>&1 &

      - name: Wait for auth-service
        run: |
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4005/validate || true)"
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          cat auth-service.log
          exit 1

      - name: Start billing-service
        run: |
          nohup java -jar billing-service/target/*.jar > billing-service.log 2>&1 &

      - name: Wait for billing-service
        run: |
          for i in {1..60}; do
            if bash -c 'printf > /dev/tcp/127.0.0.1/9001' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat billing-service.log
          exit 1

      - name: Start patient-service
        run: |
          nohup java -jar patient-service/target/*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/patientdb?createDatabaseIfNotExist=true \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.jpa.hibernate.ddl-auto=update \
            --spring.kafka.bootstrap-servers=localhost:9092 \
            --billing.service.address=localhost \
            --billing.service.grpc.port=9001 \
            > patient-service.log 2>&1 &

      - name: Wait for patient-service
        run: |
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/patients || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          cat patient-service.log
          exit 1

      - name: Start api-gateway-2
        run: |
          nohup java -jar api-gateway-2/target/*.jar \
            --auth.service.url=http://localhost:4005 \
            > api-gateway-2.log 2>&1 &

      - name: Wait for api-gateway-2
        run: |
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4004/auth/login || true)"
            if [ "$status" = "401" ] || [ "$status" = "405" ] || [ "$status" = "400" ]; then
              exit 0
            fi
            sleep 2
          done
          cat api-gateway-2.log
          exit 1

      - name: Run integration tests
        run: mvn -B -f integration-tests/pom.xml test

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            auth-service.log
            billing-service.log
            patient-service.log
            api-gateway-2.log
